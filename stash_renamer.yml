name: Scene Renamer
description: Rename scene files based on metadata with customizable templates
version: 1.0.0
url: https://github.com/lucasnegrao/stash_renamer
ui:
  javascript:
    - ui/dist/example.js
settings:
  template:
    displayName: Filename Template
    type: STRING
    description: "Template for renaming files."
  scenesPathTemplate:
    displayName: Scenes path template
    type: STRING
    description: "Template for renaming scenes folders."
  groupsPathTemplate:
    displayName: Groups path template
    type: STRING
    description: "Template for renaming scenes folders."
  useSamePathForGroups:
    displayName: Use scenes path template for groups
    type: BOOLEAN
    description: "If true, the scenes path template will be used for renaming groups folders instead of the groups path template."
exec:
  - python3
  - "{pluginDir}/stash_renamer_plugin.py"
interface: raw
tasks:
  - name: Rename Scenes (Dry Run)
    description: Preview what files would be renamed without making changes
    defaultArgs:
      mode: dry_run
      dry_run: "true"
      debugMode: "false"
  - name: Rename Scenes  
    description: Rename scene files based on configured template
    defaultArgs:
      mode: rename
      dry_run: "false"
      debugMode: "false"
